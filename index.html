/* ---------- file helpers ---------- */
function loadImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){res(im)};im.onerror=function(){rej(new Error('bad image'))};im.src=u})}
async function prep(file){
 var im=await loadImg(file);
 function draw(max,qual){var sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c}
 var big=draw(1800),small=draw(220),cardc=draw(480);
 var blob=await new Promise(function(r){big.toBlob(r,'image/jpeg',.88)});
 return {blob:blob,thumb:small.toDataURL('image/jpeg',.7),card:cardc.toDataURL('image/jpeg',.7)};
}
async function uploadAll(list){
 var urls=[],viaWA=false;
 for(var i=0;i<list.length;i++){
  if(assets){try{var r=await assets.upload(list[i].blob);urls.push(r.id);continue}catch(e){}}
  viaWA=true;
 }
 return {urls:urls,viaWA:viaWA||!assets};
}

 if(a==='saveprod'){
  var e2=adm.edit;e2.name=$('#e-name').value.trim();e2.col=$('#e-col').value;e2.kind=$('#e-kind').value;e2.desc=$('#e-desc').value.trim();var tg=$('#e-tag').value;e2.tags=tg?[tg]:[];

  delete e2.sample;var isNew=e2.isNew;delete e2.isNew;

 if(a==='bulk'){
  var fl=$('#bulk-files').files,col=$('#bulk-col').value,msg=$('#bulk-msg');
  if(!fl.length){msg.textContent='Select at least one image first.';return}
  el.disabled=true;var ok=0,fail=0,added=[],tasks=[],active=0,waiters=[];
   async function slot(){while(active>=4)await new Promise(function(r){waiters.push(r)});active++}
   function freeSlot(){active--;var w=waiters.shift();if(w)w()}
   function qadd(blob,nm,idx,card){return slot().then(function(){tasks.push(addProd(blob,nm,idx,card).catch(function(){fail++}).then(function(){freeSlot();msg.textContent='Uploaded '+ok+' so far...'}))})}
  var gc=Math.max(1,Math.min(6,+$('#bulk-cols').value||1)),gr=Math.max(1,Math.min(6,+$('#bulk-rows').value||1));
  function addProd(blob,nm,idx,card){var pid='p'+Date.now().toString(36)+idx+Math.floor(Math.random()*99);return assets.upload(blob).then(function(br){added.push({id:pid,col:col,name:nm,kind:col==='polaroids'?'polaroid':'poster',desc:'High-quality print for your wall.',tags:[],imgId:br.id});ok++;if(card){DBIMG[pid]=card;return db.doc('pimg/'+pid).set({u:card}).catch(function(){})}})}
  var n=0;
  for(var bi=0;bi<fl.length;bi++){
   var f0=fl[bi],base=f0.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim().replace(/\b\w/g,function(m){return m.toUpperCase()})||'New poster';
   try{
    if(/pdf$/i.test(f0.type)||/\.pdf$/i.test(f0.name)){
     if(!window.pdfjsLib){fail++;msg.textContent='PDF reader could not load. Check your connection and reload.';continue}
     pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      msg.textContent='Reading '+f0.name+'...';
     var doc=await pdfjsLib.getDocument({data:await f0.arrayBuffer()}).promise;

      msg.textContent='File '+(bi+1)+' of '+fl.length+', page '+pn+' of '+doc.numPages+'...';
      var pg=await doc.getPage(pn),vp0=pg.getViewport({scale:1}),sc=Math.min(2,1500/Math.max(vp0.width,vp0.height)),vp=pg.getViewport({scale:sc});

       var cc=document.createElement('canvas');cc.width=cw;cc.height=ch;cc.getContext('2d').drawImage(cv,rx*cw,ry*ch,cw,ch,0,0,cw,ch);

      }
     }

     msg.textContent='Uploading '+(bi+1)+' of '+fl.length+'...';
     var bp=await prep(f0);n++;await qadd(bp.blob,base,n,bp.card);
    }
   }catch(x){fail++}
  }
  if(ok){cfg.products=cfg.products.filter(function(p){return !(p.col===col&&p.sample)}).concat(added);await persist()}
  msg.textContent=ok+' added'+(fail?', '+fail+' failed (try those again)':'')+'.';el.disabled=false;render();return}
